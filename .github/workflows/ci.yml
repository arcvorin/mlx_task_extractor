name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run package tests
        run: swift test

      - name: Build native app
        run: >-
          xcodebuild
          -project TaskBench.xcodeproj
          -scheme TaskBench
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/TaskBenchDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

